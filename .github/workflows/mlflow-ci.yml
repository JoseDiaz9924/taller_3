name: MLflow CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  train-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert jupyter ipykernel

          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Train model
        run: jupyter nbconvert --execute --to notebook --ExecutePreprocessor.kernel_name=python3 train.ipynb

      - name: Validate model
        run: jupyter nbconvert --execute --to notebook --ExecutePreprocessor.kernel_name=python3 validate.ipynb